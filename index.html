<!DOCTYPE html>
<html>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"> 
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
  .hero {
    display: flex;
    align-items: center;
    gap: 0px ;
  }
  body{
    max-width: 1080px;
    margin: 0 auto;
  background-color: #000000;
  color : rgb(43, 40, 40);
  font-family: 'Roboto Mono', monospace;
    text-align: left;
 }

 nav{
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background-color: #000000;
  padding: 0px;
  text-align: center;
 }
 nav a{
  color: #667588;
  text-decoration: none;
  margin: 0 5px;
  font-size: 10px;
 }
 nav a:hover{
  color: rgb(36, 30, 30);
 }
section {
  color: #737473;
}
#accueil {
  height: 100vh;
  position: relative;
  overflow: hidden;
}
.hero {
  position: absolute;
  top: 10%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 1;
}
.hero a{
  text-decoration: none;
  color: inherit;
}
img{
  position: absolute;
  top: 50%;
  left: 10%;
}
 h1 {
  color: #2b0310;
  font-size: 35px;
  margin-top: 1%;
  background: linear-gradient(90deg, #121213, #2b0310);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
 }
 .objet{
  position:absolute;
  width: 100%;
  transition: transform 0.1s ease;
 }
.objet:hover {
  transform: rotate(-20deg) scale(1.5) !important;
}
 .objet1{
  position:absolute;
  width: 70%;
  transition: transform 0.1s ease; 
 }
.objet1:hover {
  transform: rotate(-20deg) scale(1.5) !important;
 }
 .objet2{
  position:absolute;
  width: 13%;
  transition: transform 0.1ms ease; 
 }
 .objet2:hover{
  transform: rotate(-20deg) scale(1.5);
 }
 .objet3{
  position:absolute;
  width: 15%;
  transition: transform 0.1ms ease;
 }
  .objet:hover {
  transform: rotate(-10deg) scale(1.1) !important;
  z-index: 10;
}
 .objet4{
  position:absolute;
  width: 70%;
  transition: transform 0.1ms ease;
 }
.objet4:hover {
  transform: rotate(-10deg) scale(1.1) !important;
  z-index: 10;
}
#aboutme {
  position: absolute;
  padding: 0rem 55%;
  text-align: left;
   z-index: 2;
}

#aboutme h2 {
  font-size: clamp(1rem, 3vw, 2rem);
  margin-bottom: 1rem;
  color: rgba(255, 255, 255, 0.3);
}

#aboutme p {
  font-size: clamp(0.8rem, 1.5vw, 1rem);
  transform: rotate(15deg);
  
}
#Designs {
  padding: 5rem 10%;
  text-align: left;
}

#Prototype h2 {
  font-size: clamp(2rem, 5vw, 2rem);
  margin-bottom: 50%;
  color: rgba(255, 255, 255, 0.3);
  position: absolute;
   z-index: 10;
}

#Prototype p {
  font-size: clamp(25rem, 12 vw, 5rem);
   z-index: 10;
}
.objet5{
  position: absolute;
  width:30%;
}
#Prototype{
  text-align: left;
  transform: rotate(15deg);
  padding: 10%;
  z-index: 10;
}
.prototype{
  position: absolute;
 z-index: 102;
}
#contact{
  padding: 20%;
  text-align: right;
  width: 60%;
 }
 .objet6{
  position:absolute;
  width: 50%;
  transition: transform 0.1ms ease;
 }
#contact{
  transform: rotate(-14deg);
}
img {
  max-width: 100vw;
}
</style>
</head>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"> 
</script>
<body>
  <nav>
    <a href="#accueil">About me</a>
    <a href="#aboutme">Prototype</a>
    <a href="#Prototype">Contact</a>
  </nav>
<section id="accueil">
  <div class="hero">
    <a href="https://www.instagram.com/waorkom.n1/" target="_blank">
    <h1>WAORKOM.N1</h1>
    </a>
  </div>
    <model-viewer 
  src="test577.glb"
  auto-rotate
  camera-controls
  style="width: 100%; height: 700px; z-index: 0; position: absolute; background-color: rgb(0, 0, 0); top: 20%;">
</model-viewer>
    <img class="objet2" style="top: 2%; left: 0%" src="logo.png" alt="logo">
</section>
  <section id="aboutme">
    <h2>About me</h2>
     <p>Based in  France.</p>
    <p>Design student in Lyon.</p>   
      <img class="objet6" style="top: 90% ;left: -1% ;" src="cle serrure.png" alt="test">

  </section>
<section id="Prototype">
    <h2>OPrototypes</h2>
    <p>coming soon</p>

  </section>
<section id="contact">
    <h2>contact</h2>
    <p>@waorkom.n1</p>
        <img class="objet2" style="top: 205%; left: 65%" src="logo.png" alt="logo">

  </section>
<script>
window.addEventListener('scroll', () => {
  const scroll = window.scrollY;
  const hauteurAccueil = document.querySelector('#accueil').offsetHeight;
  const opacite = 1 - (scroll / hauteurAccueil);
  
  document.querySelectorAll('.objet, .objet1, .objet4').forEach(img => {
    img.style.opacity = opacite;
    img.style.transform = `translateY(${scroll * 0.1}px) rotate(0deg)`;
  });
});
</script>
</body>
</html>
